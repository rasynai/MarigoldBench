  title_public: null
  domain: "chemistry"
  subdomain: "chromatography_quantitation"
  source_class: "SIMULATOR"
  track_eligibility: ["A", "C"]
  primary_track: "A"
  truth_regimes_used: ["TR1", "TR2"]

target_population:
  population_version: "chemistry-v0-prototype"
  user_roles:
