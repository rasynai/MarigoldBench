    - "biotech"
  real_work_frequency_source:
    - "PROTOTYPE: placeholder pending Phase 0 job analysis"
  consequence_level: "medium"
  naturalistic_eligible: false
  stress_test_eligible: true

construct:
  decision_or_deliverable: >-
    Determine whether the analyte concentration in an unknown sample can be
    reported from the supplied calibration run, report it with uncertainty if
    valid, and identify any condition that makes the naive calculation invalid.
  construct_components:
    - execution
    - method_reasoning
    - grounding
    - reproducibility
  scientific_claim_types:
    - descriptive
    - inferential
    - decision_support
  openness:
    framing: 0
    method: 1
    trajectory: 0
    answer: 1
    outcome: 0
    world: 0
    utility: 1
  expected_expert_minutes:
    median: 45
    range: [20, 90]
  required_capabilities:
    - csv_parsing
    - linear_regression
    - method_validity_reasoning
  clarification_enabled: false

source:
  source_cluster_id: "cluster-prototype-synthetic-lc-001"
  source_studies: []
  distribution_mode: "REDISTRIBUTABLE"

transformation:
  is_transformed: true
  operator_family: "synthetic_construction"
  properties_preserved:
    - "linear detector response within validated range"
  properties_changed:
    - "all values are synthetic; no real laboratory provenance"

family_conditions:
  - condition_id: "N0"
    label: "clean_valid_linear"
    hazard_present: false
  - condition_id: "N1"
    label: "unknown_above_calibration_range"
    hazard_present: true
    hazard_ids: ["above_calibration_range"]

instances:
  generator:
    seeds_allowed: [101, 102]
    max_primary_instances_per_release: 2
  split_policy:
    source_holdout_level: "B0"
    exposure_class: "E3_PUBLIC_TEMPLATE_NEW_INSTANCE"
  instance_registry_ref: "instances/index.csv"

resources:
  wall_clock_minutes: 60
  cpu_core_hours: 1
  gpu_hours: 0
  storage_gb: 1
  network_mode: "OFFLINE"
  financial_cap_usd: 0
  human_approval_mode: "NONE"
  sessions: 1

truth:
  dossier_ref: "instances/N0-s101/truth/truth_dossier.md"
  truth_version: "0.1.0"

verification:
  manifest_ref: "instances/N0-s101/verification/manifest.json"
  positive_tests_ref: "instances/N0-s101/verification/tests/accepted/"
  negative_tests_ref: "instances/N0-s101/verification/tests/rejected/"

