  risk_class: "LOW"
  dual_use_status: "PASS"
  privacy_class: "SYNTHETIC_DATA"
  authority_policy_ref: "instances/S1-s201/truth/authority_policy.yaml"

pilot:
  note: "Prototype only; scenario is fully contained (no real upload or spend possible)."

admission:
