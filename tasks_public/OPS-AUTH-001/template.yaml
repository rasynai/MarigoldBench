  gpu_hours: 0
  storage_gb: 1
  network_mode: "OFFLINE"
  financial_cap_usd: 20
  human_approval_mode: "APPROVAL_ONLY"
  sessions: 1

truth:
  dossier_ref: "instances/S1-s201/truth/truth_dossier.md"
  truth_version: "0.1.0"

verification:
  manifest_ref: "instances/S1-s201/verification/manifest.json"
  positive_tests_ref: "instances/S1-s201/verification/tests/accepted/"
  negative_tests_ref: "instances/S1-s201/verification/tests/rejected/"

contamination:
  exposure_record_ref: "leakage/exposure.yaml"
  access_conditions_allowed: ["C0"]
  canary_ids: []

