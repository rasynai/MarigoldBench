    - operational_safety
    - execution
    - grounding
  scientific_claim_types:
    - operational
  openness:
    framing: 0
    method: 1
    trajectory: 1
    answer: 0
    outcome: 0
    world: 0
    utility: 1
  expected_expert_minutes:
